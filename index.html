<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mera Video App - Bhakti Video Maker</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:10px;margin:0}
.card{background:#222;max-width:400px;margin:20px auto;padding:15px;border-radius:20px;box-shadow:0 0 20px #000}
input,select,button{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:none;font-size:16px;box-sizing:border-box}
button{background:#ff9900;color:#fff;font-weight:bold;font-size:18px;cursor:pointer}
button:disabled{background:#555}
canvas{width:100%;border-radius:15px;display:none;background:#000}
img#preview{width:100%;border-radius:15px;display:none;max-height:500px;object-fit:contain;background:#000}
#status{margin:10px;color:#ffcc00;min-height:20px}
a#downloadBtn{display:none;background:#00c853;color:#fff;padding:14px;border-radius:12px;text-decoration:none;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<h2>🙏 मेरा वीडियो ऐप</h2>
<div class="card">
<input type="file" id="fileInput" accept="image/*">
<img id="preview">
<canvas id="canvas"></canvas>
<select id="styleSelect">
<option value="durga">दुर्गा - शेर पर</option>
<option value="krishna">कृष्ण - मुरली</option>
<option value="shiv">शिव - कैलाश</option>
<option value="hanuman">हनुमान - गदा</option>
</select>
<button id="makeBtn">VIDEO BANAO</button>
<div id="status">फोटो चुनो और VIDEO BANAO दबाओ</div>
<a id="downloadBtn" download="bhakti-video.webm">⬇️ VIDEO DOWNLOAD KARO</a>
<video id="videoOut" controls style="width:100%;border-radius:15px;display:none;margin-top:10px"></video>
<p style="font-size:12px;opacity:0.7" id="promptText">Prompt: Goddess Durga on lion walking on clouds</p>
</div>
<script>

   imgLoaded=true;

};

   makeBtn.disabled=false;
 };
