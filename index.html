<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanatan HD - API</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#080808;color:#fff;padding:12px;text-align:center}
h1{color:#ffcc00;font-size:20px;margin:8px 0}
.sub{color:#888;font-size:12px;margin-bottom:10px}
.apiBox{background:#1a1a1a;border:2px solid #ffaa1a;border-radius:10px;padding:10px;margin:10px 0}
.apiBox input{width:100%;background:#000;border:1px solid #444;color:#0f0;padding:10px;border-radius:8px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.gbtn{padding:13px 6px;border:none;border-radius:10px;background:linear-gradient(135deg,#ffaa1a,#ff6a00);color:#000;font-weight:bold;cursor:pointer;font-size:13px}
.durRow{display:flex;gap:8px;justify-content:center;margin:10px 0}
.dtab{padding:8px 16px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;cursor:pointer}
.dtab.active{background:#ffaa1a;color:#000;font-weight:bold}
textarea{width:100%;background:#1a1a1a;border:2px solid #333;color:#fff;padding:12px;border-radius:10px;font-size:14px;min-height:70px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer}
.btn1{background:#fff;color:#000} .btn2{background:linear-gradient(135deg,#ffaa1a,#ff6a00);color:#000}
.result{margin-top:14px;background:#151515;border-radius:14px;padding:8px;min-height:380px}
.result img,.result video{width:100%;max-width:360px;aspect-ratio:9/16;object-fit:cover;border-radius:10px;display:none;margin:auto}
.loader{display:none;padding:20px} .loader.show{display:block}
.dl{display:none;margin-top:10px;background:#00ff88;color:#000;padding:10px 18px;border-radius:20px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<h1>🙏 सनातन HD - API Version 🙏</h1>
<p class="sub">API लगाओ, झंझट खत्म | मर्यादित | Real HD</p>

<div class="apiBox">
<b style="color:#ffaa1a">🔑 API Key डालो (एक बार)</b><br>
<small style="color:#aaa">आपकी Key sk_loyk... यही डालो</small>
<input id="apiKey" type="text" placeholder="sk_... यहाँ API Key Paste करो" oninput="saveKey()">
<small id="keyStatus" style="color:#0f0"></small>
</div>

<div class="grid">
<button class="gbtn" onclick="fill('krishna')">🦚 श्रीकृष्ण</button>
<button class="gbtn" onclick="fill('shankar')">🔱 शंकर जी</button>
<button class="gbtn" onclick="fill('vishnu')">🌀 विष्णु जी</button>
<button class="gbtn" onclick="fill('durga')">🦁 माँ दुर्गा</button>
<button class="gbtn" onclick="fill('radha')">🌸 राधा जी</button>
<button class="gbtn" onclick="fill('saraswati')">📚 सरस्वती जी</button>
<button class="gbtn" onclick="fill('ram')">🏹 राम सीता</button>
<button class="gbtn" onclick="fill('hanuman')">🚩 हनुमान जी</button>
<button class="gbtn" onclick="fill('krishnaArjun')">⚔️ कृष्ण अर्जुन</button>
<button class="gbtn" onclick="fill('ganesh')">🙏 गणेश जी</button>
<button class="gbtn" onclick="fill('brahmand')">🌌 ब्रह्मांड</button>
<button class="gbtn" onclick="fill('nature')">🦚 कुदरत</button>
</div>

<div class="durRow">
<div class="dtab active" onclick="setDur(5,this)">5s</div>
<div class="dtab" onclick="setDur(10,this)">10s</div>
<div class="dtab" onclick="setDur(15,this)">15s</div>
<div class="dtab" onclick="setDur(30,this)">30s</div>
</div>

<textarea id="prompt">Maa Durga fully clothed</textarea>

<div class="btns">
<button class="btn btn1" onclick="generatePhoto()">🖼️ फोटो बनाओ</button>
<button class="btn btn2" onclick="generateVideoOnly()">🎬 वीडियो बनाओ</button>
</div>

<div class="result">
<div id="ph" style="color:#666;padding:30px">API Key डालो, फिर फोटो बनाओ - अब Limit नहीं लगेगी</div>
<div id="loader" class="loader"><div style="font-size:40px">🙏</div><div id="loadText">बना रहा हूँ...</div></div>
<img id="outImg">
<video id="outVideo" controls autoplay loop muted playsinline></video>
<a id="dlBtn" class="dl" download>⬇️ सेव करें</a>
</div>

<script>
let videoDurationSec=5; let lastImage=null;
const PROMPTS={
krishna:"photorealistic DSLR photo of Lord Krishna as real Indian man, FULLY CLOTHED, FULL SLEEVES KURTA AND FULL DHOTI, CHEST FULLY COVERED, NO BARE CHEST, real face, not cartoon",
shankar:"photorealistic DSLR photo of Lord Shiva as real Indian sage, FULL BODY COVERED, CHEST COVERED, NO BARE CHEST, trishul moon Kailash, real face, not cartoon",
vishnu:"photorealistic photo of Lord Vishnu as real Indian king, FULLY CLOTHED FULL DHOTI KURTA CHEST COVERED, Lakshmi in full modest red saree, NO BARE SKIN, not cartoon",
durga:"photorealistic photo of Maa Durga as real Indian mother goddess, FULLY CLOTHED full length modest red saree full sleeves covering chest belly legs, NO CLEAVAGE NO MIDRIFF, real mother face, real lion, not cartoon",
radha:"photorealistic photo of Radha Rani as real Indian woman, FULLY CLOTHED full modest saree dupatta covering head chest, NO BARE SKIN, not cartoon",
saraswati:"photorealistic photo of Goddess Saraswati as real Indian woman, FULLY CLOTHED full white saree covering full body, NO BARE SKIN, not cartoon",
ram:"photorealistic photo of Lord Ram Sita as real Indian king queen, BOTH FULLY CLOTHED, Ram full kurta dhoti chest covered, Sita full red saree veil, NO BARE SKIN, not cartoon",
hanuman:"photorealistic photo of Lord Hanuman as real powerful devotee, FULLY CLOTHED FULL ORANGE DHOTI CHEST COVERED, NO BARE CHEST, gada mountain, not cartoon",
krishnaArjun:"photorealistic DSLR photo of Krishna and Arjun as two real Indian men, BOTH WEARING FULL HEAVY ARMOR COVERING CHEST COMPLETELY, NO BARE CHEST NO BARE SKIN, fully clothed full royal dhoti full chest armor full sleeves, real chariot Kurukshetra, not cartoon",
ganesh:"photorealistic photo of Lord Ganesha idol as real stone idol with marigold flowers temple light, not cartoon",
brahmand:"photorealistic space photo of Sanatan universe real galaxies nebula Om light NASA style",
nature:"photorealistic DSLR wildlife photo of real Indian peacock parrot deer tiger real forest waterfall National Geographic"
};
function setDur(s,el){videoDurationSec=s; document.querySelectorAll('.dtab').forEach(t=>t.classList.remove('active')); el.classList.add('active');}
function saveKey(){ let k=document.getElementById('apiKey').value.trim(); localStorage.setItem('polli_key',k); document.getElementById('keyStatus').innerText=k?'✅ Key Save हो गई, अब Limit नहीं लगेगी':''; }
window.onload=()=>{ let k=localStorage.getItem('polli_key'); if(k){document.getElementById('apiKey').value=k; document.getElementById('keyStatus').innerText='✅ Key Loaded';} }
function fill(type){document.getElementById('prompt').value=PROMPTS[type]; generatePhoto();}
async function generatePhoto(){
const raw=document.getElementById('prompt').value.trim();
const apiKey=document.getElementById('apiKey').value.trim() || localStorage.getItem('polli_key') || "";
if(!apiKey){ alert('पहले API Key डालो!'); return; }
if(!raw) return alert('कुछ लिखो');
const ph=document.getElementById('ph'), loader=document.getElementById('loader'), imgEl=document.getElementById('outImg'), videoEl=document.getElementById('outVideo'), dl=document.getElementById('dlBtn');
ph.style.display='none'; loader.classList.add('show'); document.getElementById('loadText').innerText='HD फोटो बन रही है...'; imgEl.style.display='none'; videoEl.style.display='none'; dl.style.display='none';
try{
const seed=Math.floor(Math.random()*9999999);
const finalPrompt=encodeURIComponent(raw+", masterpiece, ultra realistic, real skin texture, sharp focus, highly detailed, 8k, respectful, fully clothed");
const url=`https://image.pollinations.ai/prompt/${finalPrompt}?width=1080&height=1920&seed=${seed}&nologo=true&enhance=true&model=flux&token=${apiKey}`;
let img=new Image(); img.crossOrigin="anonymous"; img.src=url;
await new Promise((res,rej)=>{img.onload=res; img.onerror=rej;});
lastImage=img;
imgEl.src=url; imgEl.style.display='block';
dl.href=url; dl.download=`sanatan-${Date.now()}.jpg`; dl.innerText='⬇️ HD फोटो सेव करें'; dl.style.display='inline-block';
}catch(e){ph.style.display='block'; ph.innerText='❌ Key गलत है या Net धीमा है, Key दोबारा चेक करो';}
finally{loader.classList.remove('show');}
}
async function generateVideoOnly(){
if(!lastImage){ alert('पहले फोटो बनाओ!'); return; }
const loader=document.getElementById('loader'), videoEl=document.getElementById('outVideo'), dl=document.getElementById('dlBtn');
loader.classList.add('show'); document.getElementById('loadText').innerText=`${videoDurationSec}s HD वीडियो बन रहा है...`;
await createCanvasVideo(lastImage, videoDurationSec, videoEl, dl);
loader.classList.remove('show');
}
async function createCanvasVideo(img,duration,videoEl,dlBtn){
let canvas=document.createElement('canvas'); canvas.width=1080; canvas.height=1920;
let ctx=canvas.getContext('2d');
let stream=canvas.captureStream(60);
let recorder; try{recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9', videoBitsPerSecond:8000000});}catch(e){recorder=new MediaRecorder(stream,{mimeType:'video/webm'});}
let chunks=[]; recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
recorder.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); videoEl.src=url; videoEl.style.display='block'; dlBtn.href=url; dlBtn.download=`sanatan-video-${Date.now()}.webm`; dlBtn.innerText=`⬇️ ${duration}s HD वीडियो सेव करें`; dlBtn.style.display='inline-block'; };
recorder.start(100);
let start=Date.now();
return new Promise(res=>{ function draw(){ let elapsed=(Date.now()-start)/1000; if(elapsed>=duration){recorder.stop(); res(); return;} let p=elapsed/duration; let scale=1+p*0.10; ctx.clearRect(0,0,1080,1920); let r=img.width/img.height, cr=1080/1920, dw,dh; if(r>cr){dh=1920*scale; dw=img.width*(dh/img.height);}else{dw=1080*scale; dh=img.height*(dw/img.width);} let x=(1080-dw)/2 + Math.sin(p*0.6)*10; let y=(1920-dh)/2; ctx.drawImage(img,x,y,dw,dh); requestAnimationFrame(draw);} draw(); });
}
</script>
</body>
</html>
