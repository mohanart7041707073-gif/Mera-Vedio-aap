<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mera Video App</title><style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif;padding:15px}select,input,button{width:95%;padding:14px;margin:8px 0;border-radius:10px;border:none;font-size:16px}button{background:orange;color:#fff;font-weight:bold}.card{background:#222;padding:15px;border-radius:15px}img{max-width:100%;border-radius:12px;margin-top:10px}</style></head><body><h2>🙏 मेरा वीडियो ऐप</h2><div class="card"><input type="file" id="photo" accept="image/*"><img id="preview" style="display:none"><select id="vtype"><option value="durga">दुर्गा - शेर पर</option><option value="shiv">शिव - डमरू</option><option value="krishna">कृष्ण</option><option value="hanuman">हनुमान</option><option value="ram">राम</option><option value="kali">काली</option><option value="ganesh">गणेश</option></select><button onclick="make()">VIDEO BANAO</button><p id="status"></p></div><script>let p=document.getElementById('preview');document.getElementById('photo').onchange=e=>{p.src=URL.createObjectURL(e.target.files[0]);p.style.display='block'};function make(){let t=document.getElementById('vtype').value;let pr={durga:'Goddess Durga on lion walking on clouds, diya, petals',shiv:'Lord Shiva on clouds damru',krishna:'Krishna flute peacock',hanuman:'Hanuman flying',ram:'Ram with bow',kali:'Kali divine',ganesh:'Ganesha blessing'};document.getElementById('status').innerText="Prompt: "+pr[t];}</script></body></html>`
