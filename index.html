<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>माँ दुर्गा AI - 9:16 फोटो वीडियो</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0a0a0a;color:#fff;min-height:100vh;padding:16px}
h1{text-align:center;margin:10px 0 6px;font-size:26px}
.sub{text-align:center;color:#aaa;font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:25px;border:2px solid #2a2a2a;background:#1a1a1a;color:#fff;cursor:pointer;font-weight:700;font-size:15px}
.tab.active{background:#ff1a1a;border-color:#ff1a1a}
textarea{width:100%;background:#1a1a1a;border:2px solid #333;color:#fff;padding:16px;border-radius:14px;font-size:17px;min-height:90px;outline:none}
textarea:focus{border-color:#ff1a1a}
.btn{width:100%;margin-top:12px;padding:16px;background:linear-gradient(135deg,#ff1a1a,#ff6a00);border:none;border-radius:14px;color:#fff;font-size:19px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.6}
.result{margin-top:16px;background:#151515;border-radius:16px;padding:10px;min-height:400px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #222}
.result img,.result video{width:100%;max-width:360px;aspect-ratio:9/16;object-fit:cover;border-radius:12px}
.loader{display:none;text-align:center;padding:30px}
.loader.show{display:block}
.download{margin-top:12px;display:none;background:#fff;color:#000;padding:12px 22px;border-radius:25px;text-decoration:none;font-weight:800;font-size:16px}
</style>
</head>
<body>
<h1>🙏 माँ दुर्गा AI फोटो ऐप</h1>
<p class="sub">9:16 HD | फोटो + वीडियो | गैलरी में सेव</p>
<div class="tabs">
  <div class="tab active" id="photoTab" onclick="switchMode('photo')">📸 फोटो</div>
  <div class="tab" id="videoTab" onclick="switchMode('video')">🎥 वीडियो</div>
</div>
<div class="tabs" id="durRow" style="display:none">
  <div class="tab" id="d5" onclick="setDur(5)">5s</div>
  <div class="tab active" id="d10" onclick="setDur(10)">10s</div>
  <div class="tab" id="d15" onclick="setDur(15)">15s</div>
  <div class="tab" id="d30" onclick="setDur(30)">30s</div>
</div>
<textarea id="prompt">माँ दुर्गा शेर पर सवार, लाल साड़ी, दिव्य प्रकाश, मंदिर में</textarea>
<button class="btn" id="genBtn" onclick="generate()">📸 फोटो बनाओ</button>
<div class="result" id="result">

  <div class="loader" id="loader"><div style="font-size:42px">✨</div><div id="loadText">बन रहा है...</div></div>
  <img id="outImg" style="display:none">
  <video id="outVideo" style="display:none" controls autoplay loop muted playsinline></video>
</div>
<div style="text-align:center"><a id="dlBtn" class="download" download>⬇️ गैलरी में सेव करें</a></div>
<p style="font-size:11px;color:#777;text-align:center;margin-top:8px">लंबी प्रेस करके भी गैलरी में सेव कर सकते हो</p>

let mode='photo'; window.videoDurationSec=10;
function setDur(s){window.videoDurationSec=s; document.querySelectorAll('#durRow .tab').forEach(t=>t.classList.remove('active')); document.getElementById('d'+s).classList.add('active'); if(mode==='video') document.getElementById('genBtn').innerText='🎥 '+s+'s वीडियो बनाओ';}
