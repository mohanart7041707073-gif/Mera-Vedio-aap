<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanatan HD Video Maker - 1080p</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;text-align:center;padding:15px;margin:0}
h1{color:#ffcc00;text-shadow:0 0 10px #ffcc00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}
button{padding:12px;border:none;border-radius:10px;background:linear-gradient(45deg,#ff8c00,#ffcc00);color:#000;font-weight:bold;cursor:pointer}
button:active{transform:scale(0.95)}
#result img,#result video{width:100%;max-width:400px;border-radius:15px;margin-top:15px;border:2px solid #ffcc00}
#dl{margin-top:10px;display:none;padding:12px 20px;background:#00ff88;color:#000;border-radius:8px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<h1>🙏 Sanatan HD Darshan 🙏</h1>
<p>किसी भी देवी-देवता पर क्लिक करो - HD फोटो + HD वीडियो बनेगा</p>

<div class="grid">
<button onclick="make('krishna')">🦚 श्रीकृष्ण</button>
<button onclick="make('shankar')">🔱 महादेव शंकर</button>
<button onclick="make('vishnu')">🌀 विष्णु जी</button>
<button onclick="make('durga')">🦁 माँ दुर्गा</button>
<button onclick="make('radha')">🌸 राधा रानी</button>
<button onclick="make('saraswati')">📚 सरस्वती माँ</button>
<button onclick="make('ram')">🏹 राम सीता दरबार</button>
<button onclick="make('hanuman')">🚩 हनुमान जी</button>
<button onclick="make('krishnaArjun')">⚔️ कृष्ण अर्जुन गीता</button>
<button onclick="make('brahmand')">🌌 ब्रह्मांड</button>
<button onclick="make('nature')">🦚 कुदरत पशु पक्षी</button>
<button onclick="make('janwar')">🦁 शेर हिरण प्रकृति</button>
</div>

<div id="status"></div>
<div id="result">
<img id="img" style="display:none">
<video id="vid" controls loop playsinline style="display:none"></video><br>
<a id="dl" download>⬇️ HD वीडियो सेव करें</a>
</div>

<script>
const PROMPTS={
krishna:"Lord Shri Krishna playing flute in Vrindavan, peacock feather, ultra detailed, divine light, 8k, cinematic, highly detailed face",
shankar:"Lord Shiva meditating on Kailash mountain, trishul damru, moon on head, cosmic energy, 8k ultra hd, photorealistic",
vishnu:"Lord Vishnu on Sheshnag in Kshir Sagar, Laxmi at feet, cosmic ocean, ultra hd 8k, divine",
durga:"Maa Durga on lion, 18 hands weapons, red saree, navratri, ultra detailed face, 8k, divine eyes",
radha:"Radha Rani in Barsana, beautiful divine girl, lotus, ultra beautiful, 8k, detailed eyes",
saraswati:"Goddess Saraswati on white swan, veena book, white saree, knowledge light, 8k",
ram:"Ram Sita Darbar in Ayodhya with Lakshman Hanuman, royal palace, divine, 8k ultra hd",
hanuman:"Lord Hanuman carrying mountain, flying, gada, orange sindoor, powerful, 8k photorealistic",
krishnaArjun:"Bhagavad Gita scene Krishna and Arjun on chariot in Kurukshetra war, cosmic Vishwaroop, 8k",
brahmand:"Sanatan Brahmand universe, galaxies, Om, temples in space, cosmic Hinduism, 8k",
nature:"Indian peacock, parrot, deer in beautiful forest, sunrise, ultra hd nature photography 8k",
janwar:"Lion tiger in jungle with waterfall, divine forest, ultra realistic 8k wildlife"
};

async function make(type){
let status=document.getElementById('status');
let imgEl=document.getElementById('img');
let vidEl=document.getElementById('vid');
let dl=document.getElementById('dl');
status.innerText="⏳ HD फोटो बन रही है...";
imgEl.style.display='none'; vidEl.style.display='none'; dl.style.display='none';

let prompt=encodeURIComponent(PROMPTS[type]+", masterpiece, sharp focus, high detail");
// HD 1080x1920
let imgUrl=`https://image.pollinations.ai/prompt/${prompt}?width=1080&height=1920&nologo=true&enhance=true&model=flux`;

let img=new Image();
img.crossOrigin="anonymous";
img.src=imgUrl + "&seed=" + Date.now();

img.onload=async ()=>{
imgEl.src=img.src; imgEl.style.display='block';
status.innerText="🎬 अब HD वीडियो बन रहा है... कृपया 5 सेकंड रुको";
await createCanvasVideo(img, 8, vidEl, dl);
status.innerText="✅ HD वीडियो तैयार है!";
};
img.onerror=()=>{status.innerText="❌ फिर से कोशिश करो";};
}

async function createCanvasVideo(img, duration, videoEl, dlBtn){
let canvas=document.createElement('canvas'); 
canvas.width=1080; 
canvas.height=1920;
let ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality='high';
let stream=canvas.captureStream(60);
let recorder;
try{
recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
}catch(e){
recorder=new MediaRecorder(stream,{mimeType:'video/webm', videoBitsPerSecond: 8000000 });
}
let chunks=[];
recorder.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
recorder.onstop=()=>{
let blob=new Blob(chunks,{type:'video/webm'});
let url=URL.createObjectURL(blob);
videoEl.src=url; videoEl.style.display='block';
dlBtn.href=url; dlBtn.download=`sanatan-HD-${Date.now()}.webm`; 
dlBtn.innerText=`⬇️ ${duration}s HD वीडियो सेव करें`; 
dlBtn.style.display='inline-block';
};
recorder.start(100);
let start=Date.now();
return new Promise(res=>{
function draw(){
let elapsed=(Date.now()-start)/1000;
if(elapsed>=duration){recorder.stop(); res(); return;}
let progress=elapsed/duration;
let scale=1 + progress*0.12;
ctx.clearRect(0,0,canvas.width,canvas.height);
let imgRatio=img.width/img.height; 
let cRatio=canvas.width/canvas.height;
let dw, dh;
if(imgRatio > cRatio){ dh=canvas.height*scale; dw=img.width*(dh/img.height); }
else{ dw=canvas.width*scale; dh=img.height*(dw/img.width); }
let x=(canvas.width-dw)/2 + Math.sin(progress*0.8)*12;
let y=(canvas.height-dh)/2;
ctx.drawImage(img, x, y, dw, dh);
requestAnimationFrame(draw);
}
draw();
});
}
</script>
</body>
</html>
